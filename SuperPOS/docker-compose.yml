services:
  api:
    build:
      context: .
      dockerfile: src/SuperPOS.API/Dockerfile
    restart: unless-stopped
    ports:
      - "5075:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Database=${POSTGRES_DB:-superpos};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};Timezone=UTC"
      Jwt__Secret: ${JWT_SECRET}
      DeepSeek__ApiKey: ${DEEPSEEK_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-superpos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - superpos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-superpos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    ports:
      - "5076:80"
    volumes:
      - filebrowser_files:/srv
      - filebrowser_db:/database

volumes:
  superpos_db_data:
  filebrowser_files:
  filebrowser_db:
